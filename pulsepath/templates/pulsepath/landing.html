{% extends 'base.html' %}
{% load static %}

{% block title %}PulsePath | Home{% endblock %}

{% block content %}
<style>
    /* Hero wrapper sets full-height background tone */
    .hero-wrapper {
        padding: 2px;
        min-height: 100vh;
        background-color: #c5002e;
        box-sizing: border-box;
    }

    /* Two-panel layout */
    .hero-section {
        display: flex;
        flex: 1;
        height: 100%;
        max-width: 100%;
        gap: 2px;
        flex-direction: row;
    }

    .hero-left, .hero-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* Left panel = headline, tagline, CTA */
    .hero-left {
        background-color: #ff7bdc;
        align-items: flex-start;
        padding: 5vw;
        gap: 1.5rem;
    }

    .hero-left h1 {
        font-size: 3.5rem;
        font-weight: 900;
        text-transform: lowercase;
        color: #8c0032;
        line-height: 1.1;
        margin: 0;
    }

    .hero-left p {
        font-size: 1.2rem;
        font-weight: 500;
        color: #6a0030;
        max-width: 500px;
        margin: 0;
    }

    /* Primary CTA button, map view */
    .cta-link {
        text-decoration: none;
    }

    .cta-button {
        background-color: #ffffff;
        color: #d0004f;
        border: 2px solid #d0004f;
        padding: 12px 28px;
        border-radius: 50px;
        font-weight: 700;
        text-transform: lowercase;
        font-size: 1rem;
        transition: all 0.2s ease;
    }

    .cta-button:hover {
        background-color: #ffe2eb;
        color: #a6003b;
        border-color: #a6003b;
        transform: scale(1.05);
    }

    /* Right panel = image */
    .hero-right {
        background-color: #fff;
        overflow: hidden;
    }

    .hero-right img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        .hero-wrapper {
            padding: 0;
        }

        .hero-section {
            flex-direction: column;
            gap: 0;
        }

        .hero-left,
        .hero-right {
            width: 100%;
            height: auto;
            flex: unset;
        }

        .hero-left {
            padding: 2rem 1.5rem;
            align-items: center;
            text-align: center;
        }

        .hero-left h1 {
            font-size: 2.2rem;
        }

        .hero-left p {
            font-size: 1rem;
        }

        .hero-right img {
            height: 250px;
            border-top: 2px solid #c5002e;
        }
    }
</style>

<!-- Final layout structure -->
<div class="hero-wrapper">
    <div class="hero-section">
        <!-- Left = Hook and CTA -->
        <div class="hero-left">
            <h1>all the buzz<br><em>none</em> of the stress</h1>
            <p>navigate festivals in real-time without losing the vibe</p>
            <a href="{% url 'map' %}" class="cta-link">
                <button class="cta-button">explore now</button>
            </a>
        </div>
        <!-- Right = Image -->
        <div class="hero-right">
            <img src="{% static 'images/festival.jpg' %}" alt="Festival scene">
        </div>
    </div>
</div>
{% endblock %}
